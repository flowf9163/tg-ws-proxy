name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install pinned Android NDK
        run: |
          ndk="$(sed -n -E 's/^ndk = "(.+)"/\1/p' android/gradle/libs.versions.toml)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug & Release APKs
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APKs (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-release-apks
          path: android/app/build/outputs/apk/release/*.apk
